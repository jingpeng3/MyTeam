  }
  return `<div class="det-h">${esc(t.task_id)}</div>
    <span class="det-badge" style="color:${cm[1]};border-color:${cm[2]}">${cm[0]}</span>
    ${agentBtns(t)}
    ${row('Agent', t.agent?`<span class="alink" onclick="openAgent('${esc(t.agent)}')" title="查看配置与 skill">${esc(t.agent)}</span>`:'—')}
    ${row('能力', caps)}
    ${row('流程上游', needs)}${dataRow}${inh}
    ${foRow}
    ${(t.reject_count||0)?row('被打回', t.reject_count+' 次'):''}
    ${canRej}

    ${row('Pane', t.pane?esc(t.pane):'—')}
    ${live}${rejSec}${runsSec(t)}

    ${expect}${outcome}`;

function oMove(ch, pts, done){
  const cur=oPos(ch); oStop(ch);
  const path=[cur];
  pts.forEach(p=>{ const q=path[path.length-1]; if(Math.hypot(p.x-q.x,p.y-q.y)>1) path.push(p); });
  if(path.length<2){ oPlace(ch,cur); if(done) done(); return; }
  const acc=[0];
  for(let i=1;i<path.length;i++) acc.push(acc[i-1]+Math.hypot(path[i].x-path[i-1].x, path[i].y-path[i-1].y));
  const L=acc[acc.length-1], ms=Math.max(420, L/O_SPEED*1000);
  ch.seated=false; ch.at={kind:'walk'};
  oMode(ch,null); oEmote(ch,''); ch.el.classList.add('walk'); ch.el.style.zIndex=900;
  path.slice(1).forEach((p,i)=>{ const dx=p.x-path[i].x;
    if(i===0) oFace(ch,dx); else ch.ftimers.push(setTimeout(()=>oFace(ch,dx), acc[i]/L*ms)); });

}

function oRoute(ch, to){
  const p=oPos(ch), at=ch.at||{};
  const inLounge = at.kind==='lounge' || (at.kind!=='desk' && p.x>=632);
  if(to.kind==='lounge' && inLounge) return [to.p];
  let out;
  if(at.kind==='desk'){ const s=seatOf(at.d), lx=laneX(at.d); out=[{x:lx,y:s.y},{x:lx,y:AISLE}]; }
  else out = inLounge ? [LOUNGE_IN] : [{x:p.x,y:AISLE}];
  if(to.kind==='lounge') return out.concat([LOUNGE_IN, to.p]);
  const s=seatOf(to.d), lx=laneX(to.d);
  return out.concat([{x:lx,y:AISLE},{x:lx,y:s.y},s]);
}
function oFreeSpot(ex){
  const used=new Set(ofc.chars.filter(c=>!c.dying && c!==ex && c.spot).map(c=>c.spot));
  const free=O_SPOTS.filter(s=>!used.has(s));
  if(free.length) return free[Math.floor(Math.random()*free.length)];
  return {x:672+Math.random()*266, y:206+Math.random()*300, k:'rug'};
}
function oIdle(ch){
  ch.at={kind:'lounge'};
  const k=ch.spot ? ch.spot.k : 'rug';
  oMode(ch, k==='sofa' ? 'idle sit' : 'idle'); oBubble(ch,null);
  oEmote(ch, k==='sofa' ? '💤' : k==='coffee' ? '☕' : (Math.random()<.35 ? '♪' : ''));
}
// 回待命区：同 agent 还有别的分身在场 → 走到入口淡出合并；否则找个空位待命
function oToLounge(ch, instant){
  oClearTimers(ch);
  if(ofc.chars.some(c=>c!==ch && !c.dying && c.agent===ch.agent)){
    ch.dying=true; ch.spot=null;
    if(instant) return oRemove(ch);
    return oMove(ch, oRoute(ch,{kind:'lounge', p:{x:LOUNGE_IN.x+26, y:AISLE}}), ()=>oRemove(ch));
  }
  ch.spot=oFreeSpot(ch);
  if(instant){ oPlace(ch, ch.spot); oIdle(ch); return; }
  oMove(ch, oRoute(ch,{kind:'lounge', p:ch.spot}), ()=>oIdle(ch));
}
function oRemove(ch){
  ch.dying=true; oClearTimers(ch); oStop(ch);
  ofc.chars=ofc.chars.filter(c=>c!==ch);
  ch.el.animate([{opacity:1},{opacity:0}],{duration:360, fill:'forwards'}).onfinish=()=>ch.el.remove();
}
function oWander(){
  if(!ofc || ofc.party || Math.random()<.3) return;
  const idle=ofc.chars.filter(c=>!c.dying && c.desk==null && !c.anim && c.at.kind==='lounge' && !c.timers.length);
  if(!idle.length) return;
  if(idle.length>=2 && Math.random()<.4) return oChat(idle);
  const ch=idle[Math.floor(Math.random()*idle.length)];
  ch.spot=oFreeSpot(ch); oMove(ch, [ch.spot], ()=>oIdle(ch));
}
/* ---- 特效：交接文件夹抛物线飞行 + 虚线轨迹 + 标签、星星迸发、飘字、彩带 ---- */
function oFolderSvg(c){
  return `<svg width="26" height="22" viewBox="0 0 26 22"><path d="M1 4 Q1 2 3 2 H10 L12.5 5 H23 Q25 5 25 7 V19 Q25 21 23 21 H3 Q1 21 1 19 Z" fill="${c}"/>
    <rect x="1" y="8" width="24" height="13" rx="2" fill="#fff" opacity=".28"/><rect x="5" y="11" width="11" height="2" rx="1" fill="#fff" opacity=".8"/></svg>`;
}
function oFly(from, to, color, label, onLand){
  const O=ofc; if(!O) return;
  const el=document.createElement('div'); el.className='ofld'; el.innerHTML=oFolderSvg(color); O.fx.appendChild(el);
  const dist=Math.hypot(to.x-from.x, to.y-from.y), h=Math.min(130, 36+dist*.28), N=16, kf=[];
  for(let i=0;i<=N;i++){ const s=i/N, k=Math.sin(Math.PI*s);
    kf.push({transform:`translate(${from.x+(to.x-from.x)*s}px,${from.y+(to.y-from.y)*s-k*h}px) rotate(${(s-.5)*36}deg) scale(${.8+k*.45})`}); }
  el.animate(kf, {duration:Math.max(1000, Math.min(1700, dist*2.4)), easing:'ease-in-out', fill:'forwards'})
    .onfinish=()=>{ el.remove(); if(ofc===O){ oBurst(to, 5, ['✨']); if(onLand) onLand(); } };
  const mx=(from.x+to.x)/2, my=(from.y+to.y)/2;
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', `M${from.x},${from.y} Q${mx},${my-2*h} ${to.x},${to.y}`); path.setAttribute('stroke', color);
  O.trail.appendChild(path); setTimeout(()=>path.remove(), 2700);
  if(label){ const lb=document.createElement('div'); lb.className='olbl'; lb.style.cssText=`left:${mx}px; top:${my-h-16}px; --c:${color}`;
    lb.textContent=label; O.fx.appendChild(lb); setTimeout(()=>lb.remove(), 2700); }
}
function oBurst(p, n, set){
  const O=ofc; if(!O) return;
  set = set || ['⭐','✨','🌟','💫'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span'); s.className='ostar'; s.textContent=set[i%set.length]; O.fx.appendChild(s);
    const a=Math.PI*2*i/n+Math.random()*.5, r=26+Math.random()*34, x=p.x+Math.cos(a)*r, y=p.y+Math.sin(a)*r*.75-12;
    s.animate([{transform:`translate(${p.x}px,${p.y}px) scale(.3)`, opacity:1},
      {transform:`translate(${x}px,${y}px) scale(1.15) rotate(${(Math.random()-.5)*90}deg)`, opacity:1, offset:.6},
      {transform:`translate(${x}px,${y+10}px) scale(.8)`, opacity:0}], {duration:900+Math.random()*400, easing:'cubic-bezier(.2,.8,.3,1)'})
      .onfinish=()=>s.remove();
  }
}
function oFloat(p, text, color){
  const O=ofc; if(!O) return;
  const s=document.createElement('span'); s.className='ofloat'; s.textContent=text; s.style.color=color; O.fx.appendChild(s);
  s.animate([{transform:`translate(${p.x}px,${p.y}px) translateX(-50%) scale(.6)`, opacity:0},
    {transform:`translate(${p.x}px,${p.y-16}px) translateX(-50%) scale(1.1)`, opacity:1, offset:.25},
    {transform:`translate(${p.x}px,${p.y-46}px) translateX(-50%) scale(1)`, opacity:0}], {duration:1600, easing:'ease-out'})
    .onfinish=()=>s.remove();
}
function oConfetti(){
  const O=ofc; if(!O) return;
  let cv=O.stage.querySelector('.ofc-cv');
  if(!cv){ cv=document.createElement('canvas'); cv.className='ofc-cv'; cv.width=OW*2; cv.height=OH*2; O.stage.appendChild(cv); }
  const g=cv.getContext('2d'); g.setTransform(2,0,0,2,0,0);
  const cols=['#ff5e7e','#ffd23f','#4fc3f7','#81c784','#ba68c8','#ff8a65','#ffffff'], ps=O.confetti=(O.confetti||[]);
  const add=(x,y,vx,vy)=>ps.push({x,y,vx,vy, r:Math.random()*6.3, vr:(Math.random()-.5)*.3, w:5+Math.random()*5,
    h:3+Math.random()*4, c:cols[ps.length%cols.length], s:Math.random()*6.3});
  for(let i=0;i<150;i++) add(Math.random()*OW, -10-Math.random()*240, (Math.random()-.5)*2, 1+Math.random()*2.4);
  for(let i=0;i<90;i++){ const L=i%2; add(L?OW-30:30, OH-24, (L?-1:1)*(2.5+Math.random()*4.5), -(6+Math.random()*5.5)); }
  if(O.raf) return;
  const step=()=>{
    if(ofc!==O) return;
    g.clearRect(0,0,OW,OH);
    for(let i=ps.length-1;i>=0;i--){
      const p=ps[i]; p.vy=Math.min(p.vy+.07, 3); p.vx*=.992; p.s+=.07; p.x+=p.vx+Math.sin(p.s)*.5; p.y+=p.vy; p.r+=p.vr;
      if(p.y>OH+20){ ps.splice(i,1); continue; }
      g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c;
      g.fillRect(-p.w/2, -p.h/2, p.w, p.h*Math.abs(Math.cos(p.s))+1); g.restore();
    }
    O.raf = ps.length ? requestAnimationFrame(step) : null;
  };
  O.raf=requestAnimationFrame(step);
}
/* ---- 工位与任务的绑定：入座、在岗状态同步、离座（完成小庆祝 / 失败 / 打回 / 重置） ---- */
const oActive=t=>!!t && !!t.agent && (t.status==='dispatched'||t.status==='awaiting_input');
const oTime=()=>{ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };
// ts 缺省=现在；非今天的条目带上月-日
function oFeed(html, cls, ts, tid){
  const box=document.getElementById('ofcFeed'); if(!box) return;
  const d=ts ? new Date(ts*1000) : null, today=!d || d.toDateString()===new Date().toDateString();
  const t=d ? (today ? '' : pad(d.getMonth()+1)+'-'+pad(d.getDate())+' ')+evtime(ts) : oTime();
  const e=document.createElement('div'); e.innerHTML=`<span class="t">${t}</span><span class="x ${cls||''}">${html}</span>`;
  if(tid){ e.dataset.tid=tid; e.title='点击查看任务卡'; }
  box.prepend(e); while(box.children.length>60) box.lastChild.remove();
}
/* 打开时从账本的运行记录 + 打回记录重建历史动态：关掉期间发生的交接/完成也看得到，重开不丢。
   之后的实时变化由 ofcApply 逐条追加。 */
const O_RUN_END={done:['✓','完成','ok'], failed:['✗','失败','bad'], timeout:['✗','超时','bad'], fatal:['✗','致命失败','bad'],
  retasked:['↺','改写重派',''], reset:['↺','连锁重置',''], superseded:['↺','被覆盖',''], bypassed:['↺','被绕过','']};
function oHistory(job){
  const ts=job.tasks||[], byId={}, ev=[];
  ts.forEach(t=>byId[t.task_id]=t);
  const doneAt=u=>{ const r=((byId[u]||{}).runs||[]).filter(r=>r.outcome==='done' && r.ended_at).slice(-1)[0]; return r ? r.ended_at : null; };
  ts.forEach(t=>(t.runs||[]).forEach(r=>{
    const who=esc(r.agent||t.agent||'?'), tid=esc(t.task_id);
    if(r.started_at){
      ev.push([r.started_at, 1, `▶ <b>${who}</b> 接手 ${tid}${(r.attempt||1)>1?' · 第 '+r.attempt+' 次':''}`, 'go', t.task_id]);
      (t.needs||[]).forEach(u=>{ const at=doneAt(u); if(at && at<=r.started_at)
        ev.push([r.started_at, 0, `📁 交接 ${esc(u)} → ${tid}（${esc((byId[u]||{}).agent||'?')} → <b>${who}</b>）`, 'hand', t.task_id]); });
    }
    const o=O_RUN_END[r.outcome];
    if(r.ended_at && o) ev.push([r.ended_at, 2, `${o[0]} <b>${who}</b> ${o[1]} ${tid}${r.outcome==='done'&&r.active_s!=null?' · '+dur(r.active_s):''}`, o[2], t.task_id]);
  }));
  ts.forEach(t=>(t.rejections||[]).forEach(r=>{ if(r.ts)
    ev.push([r.ts, 3, `↩ ${esc(r.from||'?')} 打回 ${esc(t.task_id)}${r.reason?'：'+esc(clip(r.reason,60)):''}`, 'rej', t.task_id]); }));
  ev.sort((a,b)=>a[0]-b[0] || a[1]-b[1]);
  ev.slice(-60).forEach(e=>oFeed(e[2], e[3], e[0], e[4]));
  return ev.length;
}
function oDeskSet(d, agent, typing){
  const el=ofc.desks[d].el;
  if(!agent){ el.classList.remove('on','typing','ask'); return; }
  el.style.setProperty('--c', ofc.agents[agent].look.c);
  el.querySelector('.plate').textContent=agent; el.classList.add('on'); el.classList.toggle('typing', !!typing);
}
function oDeskPoint(tid){ const b=ofc.bind[tid]; const d=b?b.d:ofc.lastDesk[tid]; return d==null ? null : deskTop(d); }
function oSync(ch, t){
  if(!ch.seated || !t) return;
  const aw=t.status==='awaiting_input';
  oMode(ch, aw?'await sit':'work sit'); ch.el.classList.remove('face-l');
  if(aw) oBubble(ch, t.escalated?'⚠ 打回超限 · 待裁决':'🙋 等人决策', 'await', 'aw|'+t.task_id);
  else oBubble(ch, `<b>${esc(clip(t.task_id,16))}</b><i data-e="${t.elapsed_s??0}">${dur(t.elapsed_s)}</i>`, '', 'w|'+t.task_id);
  ch.el.title = aw && t.awaiting_reason ? `${ch.agent} 等待：${t.awaiting_reason}` : `${ch.agent} · ${ofc.agents[ch.agent].look.kind} · ${t.task_id}`;
  oDeskSet(ch.desk, ch.agent, !aw); ofc.desks[ch.desk].el.classList.toggle('ask', aw);
}
function oAssign(t, first, newly){
  const O=ofc, tid=t.task_id, free=i=>!O.desks[i].task;
  let d=O.agentDesk[t.agent];
  if(d==null || !free(d)) d=O.desks.findIndex((_,i)=>free(i));
  if(d<0){ O.overflow.add(tid); return; }
  O.overflow.delete(tid);
  O.desks[d].task=tid; O.agentDesk[t.agent]=d; O.bind[tid]={d, ch:null};
  oDeskSet(d, t.agent, false);
  let ch=O.chars.filter(c=>!c.dying && c.agent===t.agent && c.desk==null).sort((a,b)=>a.busyUntil-b.busyUntil)[0];
  if(!ch) ch=oSpawn(t.agent, first ? seatOf(d) : {x:LOUNGE_IN.x+20, y:AISLE}, !first);
  ch.desk=d; ch.task=tid; ch.spot=null; O.bind[tid].ch=ch;
  oClearTimers(ch); oEmote(ch,'');
  const flights=[];
  const sit=()=>{ ch.at={kind:'desk', d}; ch.seated=true; oSync(ch, O.byId[tid]);
    flights.splice(0).forEach((f,i)=>oLater(f, 250+i*380)); };
  if(first){ oStop(ch); oPlace(ch, seatOf(d)); sit(); return; }
  const go=()=>{ oBubble(ch, `→ ${esc(tid)}`, '', 'go|'+tid); oMove(ch, oRoute(ch,{kind:'desk', d}), sit); };
  const wait=ch.busyUntil-Date.now(); wait>0 ? oDelay(ch, go, wait) : go();
  if(!newly) return;
  oFeed(`▶ <b>${esc(t.agent)}</b> 接手 ${esc(tid)}`, 'go', null, tid);
  // 交接：上游已完成的产物在接手方坐下后飞到本工位（同一快照里刚完成的上游从它的工位直飞，否则从交付架取），
  // 落地时接手方举手接住
  (t.needs||[]).filter(u=>(O.byId[u]||{}).status==='done').slice(0,3).forEach(u=>{
    const direct=(O.handNow[tid]||[]).includes(u), from=direct ? oDeskPoint(u) : SHELF;
    if(!from) return;
    const ua=(O.byId[u]||{}).agent||'?', c=O.agents[ua] ? O.agents[ua].look.c : '#2c9a8f';
    flights.push(()=>oFly(from, deskTop(d), c, `${u} → ${tid}`, ()=>oCatch(tid)));
    oFeed(`📁 交接 ${esc(u)} → ${esc(tid)}（${esc(ua)} → <b>${esc(t.agent)}</b>）`, 'hand', null, tid);
  });
}
function oEnd(tid, t, pt){
  const O=ofc, b=O.bind[tid]; delete O.bind[tid];
  O.desks[b.d].task=null; oDeskSet(b.d, null); O.lastDesk[tid]=b.d;
  const ch=b.ch, st=t ? t.status : 'gone', p=deskTop(b.d);
  if(ch){ ch.desk=null; ch.task=null; ch.seated=false; oClearTimers(ch); oStop(ch); oEmote(ch,''); }
  let hold=900;
  if(st==='done'){
    oBurst(p, 9); oFloat({x:p.x, y:p.y-30}, '✓ 完成 +1', '#2f855a'); hold=1800;
    if(ch){ oMode(ch,'cheer'); oBubble(ch, `✓ ${esc(tid)}`, 'done'); }
    const act=(t.timing||{}).active_s;
    oFeed(`✓ <b>${esc(t.agent||'')}</b> 完成 ${esc(tid)}${act!=null?' · '+dur(act):''}`, 'ok', null, tid);
    const downs=(O.job.tasks||[]).filter(x=>(x.needs||[]).includes(tid) && O.newly.has(x.task_id));
    if(downs.length) downs.forEach(x=>(O.handNow[x.task_id]=O.handNow[x.task_id]||[]).push(tid));
    else{ const c=ch ? O.agents[ch.agent].look.c : '#2f855a';
      oLater(()=>oFly(p, SHELF, c, `${tid} 交付`, ()=>oShelf(true)), 500); }
  }else if(st==='failed'){
    hold=2600; if(ch){ oMode(ch,'sad'); oBubble(ch, '✗ 失败了…', 'fail'); }
    oFloat({x:p.x, y:p.y-30}, '✗ 失败', '#d64545');
    oFeed(`✗ <b>${esc(t.agent||'')}</b> 在 ${esc(tid)} 失败${t.error?'：'+esc(clip(t.error,60)):''}`, 'bad', null, tid);
  }else if(t && (t.reject_count||0)>((pt||{}).reject_count||0)){
    hold=1800; if(ch){ oMode(ch,'sad'); oBubble(ch, '↩ 被打回，重来', 'fail'); }
  }else if(ch){
    const lb={skipped:'跳过', bypassed:'被绕过', pending:'重置', ready:'重新排队', gone:'已移除'}[st] || st;
    // 打回方自己也会被连锁重置：这条由第 4 步的打回动画/动态代表，不再重复记「重置」
    const rejecter=(O.job.tasks||[]).some(x=>((x.rejections||[]).slice(-1)[0]||{}).from===tid
      && (x.reject_count||0)>((O.prev.byId[x.task_id]||{}).reject_count||0));
    oMode(ch,'idle'); oBubble(ch, `↺ ${esc(lb)}`, '');
    if(rejecter) hold=1800; else oFeed(`↺ ${esc(tid)} ${esc(lb)}`, '', null, tid);
  }
  if(ch){ ch.busyUntil=Date.now()+hold; oDelay(ch, ()=>{ oBubble(ch,null); oToLounge(ch); }, hold); }
}
/* ---- 每次快照的总调和：比对上一快照 → 驱动人物、交接、打回、庆祝，刷新侧栏 ---- */
function ofcApply(job, roster){
  const O=ofc, first=!O.prev, tasks=job.tasks||[], byId={}, prevT=first ? {} : O.prev.byId;
  tasks.forEach(t=>byId[t.task_id]=t);
  O.job=job; O.byId=byId; O.roster=roster; O.fetchedAt=Date.now(); O.handNow={};
  // 1) 成员：只取本 Job 相关的 agent——分派过的，或能力命中未开工任务的候选
  const rel=new Set(tasks.map(t=>t.agent).filter(Boolean));
  const openCaps=new Set(tasks.filter(t=>t.status==='pending'||t.status==='ready').flatMap(t=>t.capabilities||[]));
  roster.forEach(a=>{ if((a.capabilities||[]).some(c=>openCaps.has(c))) rel.add(a.name); });
  const list=[...rel].map(n=>roster.find(a=>a.name===n)||{name:n});
  oAssignLooks(O, list);
  // 不再相关（候选任务被别的 agent 接走）且不在工位上的人物淡出
  O.chars.filter(c=>!c.dying && c.desk==null && !rel.has(c.agent)).forEach(oRemove);
  // 2) 本快照新开工 / 状态变化
  O.newly=new Set(first ? [] : tasks.filter(t=>oActive(t) && !oActive(prevT[t.task_id])).map(t=>t.task_id));
  if(!first) tasks.forEach(t=>{ const pt=prevT[t.task_id]; if(!pt || !oActive(t) || !oActive(pt) || pt.status===t.status) return;
    oFeed(t.status==='awaiting_input' ? `🙋 <b>${esc(t.agent)}</b> 在 ${esc(t.task_id)} 停下等人决策` : `▶ <b>${esc(t.agent)}</b> 继续 ${esc(t.task_id)}`,
      t.status==='awaiting_input' ? 'ask' : 'go', null, t.task_id); });
  // 3) 离座：任务不再在跑，或被改派给了别的 agent
  Object.keys(O.bind).forEach(tid=>{ const t=byId[tid], b=O.bind[tid];
    if(oActive(t) && (!b.ch || b.ch.agent===t.agent)) return; oEnd(tid, t, prevT[tid]); });
  // 4) 打回：目标任务 reject_count 增加 → 红色文件夹从打回方飞回被打回方
  if(!first) tasks.forEach(t=>{
    const pt=prevT[t.task_id]; if(!pt || (t.reject_count||0)<=(pt.reject_count||0)) return;
    const r=(t.rejections||[]).slice(-1)[0] || {}, from=oDeskPoint(r.from) || SHELF, to=oDeskPoint(t.task_id) || SHELF;
    oLater(()=>oFly(from, to, '#dd7230', `↩ 打回 ${t.task_id}`), 300);
    const rc=O.chars.find(c=>c.task===r.from || (c.agent===(byId[r.from]||{}).agent && !c.dying));
    if(rc && !rc.seated) oBubble(rc, `↩ 打回 ${esc(t.task_id)}`, 'fail');
    oFeed(`↩ ${esc(r.from||'?')} 打回 ${esc(t.task_id)}${r.reason?'：'+esc(clip(r.reason,60)):''}`, 'rej', null, t.task_id);
    oLater(()=>oStamp(to, '打回'), 1500);
  });
  // 5) 入座：在跑但还没工位的任务（含上轮工位满排队的）
  tasks.filter(t=>oActive(t) && !O.bind[t.task_id]).forEach(t=>oAssign(t, first, O.newly.has(t.task_id)));
  [...O.overflow].forEach(tid=>{ if(!oActive(byId[tid]) || O.bind[tid]) O.overflow.delete(tid); });
  Object.keys(O.bind).forEach(tid=>{ const b=O.bind[tid]; if(b.ch) oSync(b.ch, byId[tid]); });
  // 6) 待命区：每个相关 agent 至少一个人物
  list.forEach(a=>{ if(O.chars.some(c=>!c.dying && c.agent===a.name)) return;
    if(first){ const ch=oSpawn(a.name, {x:0,y:0}, false); ch.spot=oFreeSpot(ch); oPlace(ch, ch.spot); oIdle(ch); }
    else{ const ch=oSpawn(a.name, {x:LOUNGE_IN.x+20, y:AISLE}, true); oToLounge(ch); } });

  sim.tasks.forEach(t=>{ if(t.status==='pending' && t.needs.every(n=>by[n].status==='done')) t.status='ready'; });
  sim.tasks.forEach(t=>{
    if(t.status!=='ready') return;
    const lim=DEMO_AGENTS.find(a=>a.name===t.who).max_concurrent;
    if(sim.tasks.filter(x=>x.agent===t.who && (x.status==='dispatched'||x.status==='awaiting_input')).length>=lim) return;
    t.status='dispatched'; t.agent=t.who; t.started=sim.tick; t.left=t.len; t.runs++;
  });
}
function demoStep(sim){
  sim.tick++;
  const by={}; sim.tasks.forEach(t=>by[t.task_id]=t);
  sim.tasks.forEach(t=>{
    if(t.status==='failed'){ t.status='ready'; t.agent=''; t.len=2; return; }   // 失败后自动重试
    if(t.status==='awaiting_input'){ if(--t.wait<=0) t.status='dispatched'; return; }
    if(t.status!=='dispatched') return;
    if(t.task_id==='design' && !sim.asked && sim.tick-t.started>=2){ sim.asked=true; t.status='awaiting_input'; t.wait=2;
      t.awaiting_reason='配色要走暖色系还是冷色系？'; return; }
    if(--t.left>0) return;
    if(t.task_id==='review' && !sim.rejected){
      sim.rejected=true; const api=by['impl-api'];
      api.reject_count=1; api.rejections=[{from:'review', reason:'接口缺少鉴权校验，补上再提交', ts:Date.now()/1000}];
      api.status='ready'; api.len=2; t.status='pending'; t.agent=''; return;
    }
    if(t.task_id==='test' && !sim.failed){ sim.failed=true; t.status='failed'; t.error='2 个用例没过：登录接口偶发超时'; return; }
    t.status='done'; t.error=''; t.active=(sim.tick-t.started)*2.5;
  });
  demoDispatch(sim);
}
function demoJob(sim){
  const ts=sim.tasks.map(t=>({task_id:t.task_id, status:t.status, agent:t.agent, needs:t.needs, capabilities:t.cap, goal:t.goal,
    elapsed_s:t.status==='dispatched'||t.status==='awaiting_input' ? (sim.tick-t.started)*2.5 : null,
    timing:{active_s:t.active}, runs:Array(t.runs).fill({}), error:t.error, summary:t.status==='done' ? `产出 ${t.task_id}.md` : '',
    reject_count:t.reject_count, rejections:t.rejections, escalated:false,
    awaiting_reason:t.status==='awaiting_input' ? t.awaiting_reason : ''}));
  const done=ts.filter(t=>t.status==='done').length, complete=done===ts.length;
  return {goal_id:'demo-office', goal:'演示：从需求拆解到上线文档的完整流水线（前端模拟数据，不读写账本）',
    tasks:ts, complete, ok:complete, has_failures:false, summary:`${done}/${ts.length} done`};
}
try{ if(new URLSearchParams(location.search).get('demo')==='office') setTimeout(()=>openOffice('demo-office', true), 300); }catch(e){}
</script>
