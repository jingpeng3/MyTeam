[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-team"
dynamic = ["version"]
description = "基于 herdr 的多 agent 团队编排框架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.14.1",
]

[project.scripts]
team = "agent_team.cli:main"

[tool.setuptools]
packages = ["agent_team"]

[tool.setuptools.dynamic]
version = { attr = "agent_team.__version__" }

[tool.setuptools.package-data]
agent_team = ["dashboard.html", "worker_protocol.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["agent_team/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["F", "B", "UP"]
